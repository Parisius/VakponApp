# Container-internal Nginx config (see ../Dockerfile) — site/, admin/, and
# espace-client/ are physically nested under one root by the Dockerfile's
# COPY layout, so no alias tricks are needed here.
#
# add_header is NOT inherited into a location block that sets one of its own
# (nginx replaces the whole set, it doesn't merge) — so the security headers
# are repeated in /management/ and /espace-client/ rather than declared once
# at the server level.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Same allowlist as nginx-vakpon-tours.conf — see the comment there for
    # why localhost:3001 stays in it even though this file also serves prod.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://api.vakpon-tours.com http://localhost:3001; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.vakpon-tours.com http://localhost:3001; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /management/\nDisallow: /espace-client/\n";
    }

    location /management/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    location /espace-client/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ =404;
    }
}
