# Container-internal Nginx config (see ../Dockerfile) — site/, admin/, and
# espace-client/ are physically nested under one root by the Dockerfile's
# COPY layout, so no alias tricks are needed here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
