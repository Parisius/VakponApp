# Nginx config for vakpon-tours.com — serves this repo's three static apps
# as subpaths of one domain (matches the IS_LOCAL production URLs hardcoded
# in site/script.js, admin/modules/shared.js, espace-client/modules/shared.js).
#
# Deploy: git clone https://github.com/Parisius/VakponApp.git /var/www/VakponApp
# then drop this file at /etc/nginx/sites-available/vakpon-tours.com and:
#   ln -s /etc/nginx/sites-available/vakpon-tours.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d vakpon-tours.com -d www.vakpon-tours.com
#
# No file copying/build step needed — `git pull` in /var/www/VakponApp is the
# entire deploy for this app. Certbot will add the HTTPS server block and the
# HTTP → HTTPS redirect automatically the first time it runs.
#
# add_header is NOT inherited into a location block that sets one of its own
# (nginx replaces the whole set, it doesn't merge) — so the security headers
# are repeated in /management/ and /espace-client/ rather than declared once.

server {
    listen 80;
    listen [::]:80;
    server_name vakpon-tours.com www.vakpon-tours.com;

    root /var/www/VakponApp/site;
    index index.html;

    server_tokens off;

    # localhost:3001 stays in the allowlist even in this production-only
    # config so a dev pointing their /etc/hosts at this box for a quick check
    # doesn't get a false "CSP broke the site" scare from an unrelated cause.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://api.vakpon-tours.com http://localhost:3001; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.vakpon-tours.com http://localhost:3001; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /management/\nDisallow: /espace-client/\n";
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Published at /management/, not /admin/ — the repo folder itself stays
    # "admin" (matching local dev tooling: npx serve admin), only its
    # public URL differs.
    location /management/ {
        alias /var/www/VakponApp/admin/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    location /espace-client/ {
        alias /var/www/VakponApp/espace-client/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }
}
