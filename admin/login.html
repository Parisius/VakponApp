<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion | Vakpon Tours Back-office</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Changer de thème" style="position:fixed;top:24px;right:24px;z-index:10;">
  <svg class="moon" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
</button>

<section class="auth-screen">
  <div class="auth-side">
    <img class="logo-img" src="images/logo-white.png" alt="Vakpon Tours">
    <h1>Back-office</h1>
    <p>Suivez les réservations, gérez les offres et accompagnez vos clients, du premier message jusqu'au voyage.</p>
  </div>
  <div class="auth-main">
    <div class="auth-card">
      <span class="brand-logo">
        <img class="logo-img logo-color" src="images/logo-color.png" alt="Vakpon Tours">
        <img class="logo-img logo-white" src="images/logo-white.png" alt="Vakpon Tours">
      </span>
      <h2>Connexion</h2>
      <div class="auth-sub">Réservé à l'équipe Vakpon Tours.</div>
      <form id="loginForm">
        <div class="field"><label>Email</label><input type="email" id="loginEmail" required></div>
        <div class="field"><label>Mot de passe</label><input type="password" id="loginPassword" required></div>
        <button type="submit" class="btn-pill full">Se connecter</button>
        <div class="auth-error" id="loginError"></div>
      </form>

      <form id="otpForm" class="hidden">
        <div class="auth-sub" style="margin-bottom:16px;">Un code de vérification a été envoyé à <b id="otpEmailLabel"></b>. Il expire dans 10 minutes.</div>
        <div class="field"><label>Code à 6 chiffres</label><input type="text" id="otpCode" inputmode="numeric" pattern="[0-9]*" maxlength="6" required autocomplete="one-time-code"></div>
        <button type="submit" class="btn-pill full">Vérifier</button>
        <button type="button" class="btn-outline full" id="otpBackBtn" style="margin-top:10px;">Retour</button>
        <div class="auth-error" id="otpError"></div>
      </form>
    </div>
  </div>
</section>

<script src="modules/shared.js"></script>
<script>
  initTheme();
  if (getToken()) window.location.href = 'index.html';

  const loginForm = document.getElementById('loginForm');
  const otpForm = document.getElementById('otpForm');
  let pendingEmail = '';

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = '';
    try {
      const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
      if (data.otpRequired) {
        pendingEmail = data.email;
        document.getElementById('otpEmailLabel').textContent = data.email;
        loginForm.classList.add('hidden');
        otpForm.classList.remove('hidden');
        document.getElementById('otpCode').focus();
        return;
      }
      if (!Object.keys(ROLE_LABELS).includes(data.user.role)) {
        errorEl.textContent = "Ce compte n'a pas les droits pour accéder au back-office.";
        return;
      }
      setToken(data.accessToken);
      setIdentity(data.user);
      window.location.href = 'index.html';
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });

  document.getElementById('otpBackBtn').addEventListener('click', () => {
    otpForm.classList.add('hidden');
    loginForm.classList.remove('hidden');
    document.getElementById('otpError').textContent = '';
    otpForm.reset();
  });

  otpForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('otpError');
    errorEl.textContent = '';
    try {
      const data = await api('/auth/verify-otp', {
        method: 'POST',
        body: JSON.stringify({ email: pendingEmail, code: document.getElementById('otpCode').value.trim() }),
      });
      if (!Object.keys(ROLE_LABELS).includes(data.user.role)) {
        errorEl.textContent = "Ce compte n'a pas les droits pour accéder au back-office.";
        return;
      }
      setToken(data.accessToken);
      setIdentity(data.user);
      window.location.href = 'index.html';
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });
</script>
</body>
</html>
